spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:shiguangji}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:shiguangji}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 15MB

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

app:
  upload-dir: ${UPLOAD_DIR:/data/uploads}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:false}
    admin-username: ${APP_ADMIN_USERNAME:}
    admin-password: ${APP_ADMIN_PASSWORD:}

logging:
  level:
    root: info
    com.shiguangji: info
