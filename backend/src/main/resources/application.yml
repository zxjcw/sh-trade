spring:
  application:
    name: shiguangji
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  upload-dir: ./uploads
  timeout:
    order-pay: 30s
    auto-confirm: 10m
    review-window: 10m
    aftersale-claim: 5m
    aftersale-reply: 2m
    exchange-confirm: 10m
